<div class="app-container min-h-screen relative z-10">
  <!-- heading -->
  <header class="app-header py-3 px-4 mb-6">
    <div class="max-w-7xl mx-auto flex justify-between">
      <div class="flex">
        <div class="text-3xl md:text-5xl potion-icon">⚗️</div>
        <div>
          <h1 class="text-2xl md:text-3xl font-bold text-white">Лавка Зельевара</h1>
          <p class="text-purple-200 text-sm md:text-lg">Магические зелья на любой вкус</p>
        </div>
      </div>
    </div>
    <div
      class="absolute bottom-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-amber-400 to-transparent opacity-70"
    ></div>
  </header>

  <!-- main -->
  <main class="app-main px-4 pb-8">
    <div class="max-w-7xl mx-auto">
      <app-orders-table
        (createOrder)="openCreateDialog()"
        (editOrder)="openEditDialog($event)"
        (viewOrder)="openViewDialog($event)"
        (deleteOrder)="onOrderDeleted($event)"
      >
      </app-orders-table>
    </div>
  </main>

  <!-- footer -->
  <footer class="app-footer py-4 px-4 text-center text-purple-300 text-sm">
    <p>© 2026 Лавка Зельевара. Все магические права защищены.</p>
  </footer>

  <!-- create/update dialog -->
  <app-order-form-dialog
    [visible]="formDialogVisible()"
    [order]="selectedOrder()"
    (visibleChange)="formDialogVisible.set($event)"
    (saved)="onOrderSaved($event)"
  >
  </app-order-form-dialog>

  <!-- view dialog -->
  <app-order-view-dialog
    [visible]="viewDialogVisible()"
    [order]="selectedOrder()"
    (visibleChange)="viewDialogVisible.set($event)"
    (edit)="onEditFromView($event)"
  >
  </app-order-view-dialog>

  <!-- toasts -->
  <p-toast position="top-right"></p-toast>
</div>
